version: '3.8'

services:
  laravel.test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: main-laravel-app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: myad
      DB_USERNAME: sail
      DB_PASSWORD: password
    volumes:
      - '.:/var/www/html'
    ports:
      - '${APP_PORT:-80}:80'
    depends_on:
      - mysql
    networks:
      - sail

  mysql:
    image: 'mysql:8.0'
    container_name: main-laravel-mysql
    restart: unless-stopped
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE:-myad}'
      MYSQL_USER: '${DB_USERNAME:-sail}'
      MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - 'sail-mysql:/var/lib/mysql'
      - './db/db.sql:/docker-entrypoint-initdb.d/db.sql'
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-password}"]
      retries: 3
      timeout: 5s

networks:
  sail:
    driver: bridge

volumes:
  sail-mysql:
    driver: local
